openapi: 3.1.0
info:
  title: Vitrin Account API
  version: 2026.2.23
tags:
- name: Account
paths:
  /account:
    get:
      tags:
      - Account
      summary: Profile
      operationId: profile_account_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /account/orders:
    get:
      tags:
      - Account
      summary: Orders
      operationId: orders_account_orders_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - {}
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - {}
          description: Items per page
          default: 24
          title: Page Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /wishlist:
    get:
      tags:
      - Account
      summary: Shared Wishlist
      operationId: shared_wishlist_wishlist_get
      parameters:
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - {}
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - {}
          description: Items per page
          default: 24
          title: Page Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /account/wishlist:
    get:
      tags:
      - Account
      summary: Wishlist
      operationId: wishlist_account_wishlist_get
      parameters:
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - {}
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - {}
          description: Items per page
          default: 24
          title: Page Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /account/loyalty-program:
    get:
      tags:
      - Account
      summary: Loyalty Program
      operationId: loyalty_program_account_loyalty_program_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /addresses:
    get:
      tags:
      - Account
      summary: Addresses
      operationId: addresses_addresses_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /addresses/new:
    get:
      tags:
      - Account
      summary: Add Address
      operationId: add_address_addresses_new_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /addresses/{address_id}:
    get:
      tags:
      - Account
      summary: Edit Address
      operationId: edit_address_addresses__address_id__get
      parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: integer
          title: Address Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /account/wallet:
    get:
      tags:
      - Account
      summary: Wallet
      operationId: wallet_account_wallet_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
