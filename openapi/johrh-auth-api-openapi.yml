openapi: 3.1.0
info:
  title: Vitrin Account Auth API
  version: 2026.2.23
tags:
- name: Auth
paths:
  /auth/register:
    get:
      tags:
      - Auth
      summary: Register Page
      operationId: register_page_auth_register_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /auth/login:
    get:
      tags:
      - Auth
      summary: Login Page
      operationId: login_page_auth_login_get
      parameters:
      - name: redirect_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          title: Redirect To
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    get:
      tags:
      - Auth
      summary: Logout Page
      operationId: logout_page_auth_logout_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /auth/verify:
    get:
      tags:
      - Auth
      summary: Verification Page
      operationId: verification_page_auth_verify_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
