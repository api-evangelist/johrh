  /feeds/{token}/feed.csv:
    head:
      tags:
      - Storefront
      summary: Product Feed V2
      description: 'Stream the gzipped product feed (XML, or CSV for OpenAI) from the

        merchant''s own domain.


        Backs the new `product_feeds` system in extension-backend. The token is

        stable per-feed (rotated on regen via S3 key reuse), and the underlying

        object is uploaded with `Content-Encoding: gzip`, so we pass the raw

        bytes through unchanged and mirror the upstream headers so crawlers

        (Meta Catalog, TikTok, Google Merchant Center, OpenAI) decompress correctly.


        HEAD is forwarded upstream as HEAD: crawlers probe it before fetching,

        and we answer with the object''s headers without streaming the body.'
      operationId: product_feed_v2_feeds__token__feed_csv_head
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Storefront
      summary: Product Feed V2
      description: 'Stream the gzipped product feed (XML, or CSV for OpenAI) from the

        merchant''s own domain.


        Backs the new `product_feeds` system in extension-backend. The token is

