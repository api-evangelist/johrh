openapi: 3.1.0
info:
  title: Vitrin Account Orders API
  version: 2026.2.23
tags:
- name: Orders
paths:
  /order-summary/{order_code}/invoice:
    get:
      tags:
      - Orders
      summary: Render order invoice (order-summary alias)
      operationId: order_summary_invoice_order_summary__order_code__invoice_get
      parameters:
      - name: order_code
        in: path
        required: true
        schema:
          type: string
          description: Code of the order
          title: Order Code
        description: Code of the order
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /o/{order_code}/inv:
    get:
      tags:
      - Orders
      summary: Render order invoice (short-link alias)
      operationId: order_invoice_short_o__order_code__inv_get
      parameters:
      - name: order_code
        in: path
        required: true
        schema:
          type: string
          description: Code of the order
          title: Order Code
        description: Code of the order
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_code}/transaction-slip:
    get:
      tags:
      - Orders
      summary: Render transaction slip
      operationId: transaction_slip_upload_orders__order_code__transaction_slip_get
      parameters:
      - name: order_code
        in: path
        required: true
        schema:
          type: string
          description: Code of the order
          title: Order Code
        description: Code of the order
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /order-completed/{order_code}/invoice:
    get:
      tags:
      - Orders
      summary: Order Completed
      operationId: order_completed_order_completed__order_code__invoice_get
      parameters:
      - name: order_code
        in: path
        required: true
        schema:
          type: string
          description: Code of the order
          title: Order Code
        description: Code of the order
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_code}/completed:
    get:
      tags:
      - Orders
      summary: Render completed order view
      operationId: order_invoice_alias_orders__order_code__completed_get
      parameters:
      - name: order_code
        in: path
        required: true
        schema:
          type: string
          description: Code of the order
          title: Order Code
        description: Code of the order
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_code}/invoice:
    get:
      tags:
      - Orders
      summary: Render order invoice
      operationId: order_invoice_orders__order_code__invoice_get
      parameters:
      - name: order_code
        in: path
        required: true
        schema:
          type: string
          description: Code of the order
          title: Order Code
        description: Code of the order
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
