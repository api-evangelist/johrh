aid: johrh
name: Johrh
description: Johrh (جوهره للعبايات, "Johrh for Abayas") is a Saudi Arabian direct-to-consumer
  women's fashion retailer specializing in abayas, jalabiyas, niqabs, scarves (طرح),
  bags, and complementary modest-wear. The brand operates an Arabic-language online
  storefront hosted on the Zid e-commerce platform, selling across price tiers (99 SAR,
  199 SAR, and premium occasion pieces) with checkout through Saudi payment and
  buy-now-pay-later gateways (Tabby, Tamara, Madfu, Emkan, ZidPay, Tap, MisPay). It
  was surfaced as a portfolio-linked company and added to the API Evangelist network;
  its public web surface is served by the Zid "Vitrin" storefront application, whose
  OpenAPI is published at johrh.com/openapi.json.
